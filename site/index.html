<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Rouille</title>
  <meta name="description" content="La Rouille : un roman interactif de science-fiction. Écris à ton ancêtre à travers le temps.">
  <meta name="theme-color" content="#0a0c0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-pov="neutre">
  <header class="bar">
    <span class="brand">La Rouille</span>
    <nav class="tabs" aria-label="Sections">
      <a id="tab-story" href="#" aria-current="page">Roman interactif</a>
      <a id="tab-book" href="#livre" aria-current="false">Le livre</a>
      <a id="tab-chrono" href="#chrono" aria-current="false">Chronologie</a>
    </nav>
    <nav class="tools story-only" aria-label="Outils">
      <button id="btn-back" type="button" title="Revenir au choix précédent">↶ Revenir</button>
      <button id="btn-carnet" type="button" aria-expanded="false" aria-controls="carnet" data-count="0">Carnet</button>
      <button id="btn-gauges" type="button" aria-expanded="false" aria-controls="gauges">Jauges</button>
      <button id="btn-font" type="button" title="Taille du texte" aria-label="Changer la taille du texte">Aa</button>
      <button id="btn-restart" type="button">Recommencer</button>
    </nav>
  </header>

  <section id="gauges" class="gauges story-only" hidden aria-label="Jauges">
    <div id="gauge-bars"></div>
  </section>

  <main class="story-only">
    <article id="scene" class="scene enter" aria-live="polite">
      <p id="chapter" class="chapter"></p>
      <h1 id="title" tabindex="-1"></h1>
      <div id="text" class="text"></div>
      <div id="choices" class="choices"></div>
    </article>
  </main>

  <aside id="carnet" class="carnet story-only" hidden aria-label="Le carnet">
    <div class="carnet-head">
      <h2>Le carnet</h2>
      <button id="close-carnet" type="button" aria-label="Fermer le carnet">✕</button>
    </div>
    <ol id="carnet-list"></ol>
  </aside>

  <main id="book" class="book-only" aria-live="polite"></main>
  <main id="chrono" class="chrono-only"></main>

  <noscript><p style="padding:1rem">Ce livre interactif nécessite JavaScript.</p></noscript>
  <script src="story.js"></script>
  <script src="engine.js"></script>
  <script src="book.js"></script>
  <script src="book-ui.js"></script>
  <script src="chrono.js"></script>
</body>
</html>
